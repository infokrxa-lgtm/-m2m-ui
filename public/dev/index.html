<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Developer UI</title><style>body{margin:0;font-family:system-ui;background:#0f172a;color:#fff}.app{padding:22px;max-width:1200px;margin:0 auto}.card{background:#111827;border:1px solid #334155;border-radius:18px;padding:16px;margin:10px 0}textarea{width:100%;min-height:520px;background:#020617;color:#e5e7eb;border:1px solid #334155;border-radius:14px;padding:14px}button{border:0;border-radius:12px;padding:12px 16px;font-weight:900;margin:4px}pre{background:#020617;border-radius:12px;padding:12px;white-space:pre-wrap;max-height:560px;overflow:auto}</style></head><body><div class="app"><h1>말대말 Developer UI</h1><div class="card"><button onclick="loadConfig()">설정 열기</button><button onclick="loadLog()">KRXA/AI 로그</button><button onclick="location.href='/'">사용자 UI</button></div><div class="card"><textarea id="editor"></textarea></div><div class="card"><pre id="out">대기 중</pre></div></div><script>async function loadConfig(){let r=await fetch('/api/ui/config');editor.value=JSON.stringify((await r.json()).config,null,2)}async function loadLog(){let r=await fetch('/api/krxa/log');out.textContent=JSON.stringify(await r.json(),null,2)}loadConfig()</script></body></html>
