<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>말대말</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#050816;color:#fff}.app{max-width:1160px;margin:0 auto;min-height:100vh;padding:22px}.top{display:flex;justify-content:space-between;gap:12px}.brand{font-size:31px;font-weight:900}.pill{display:inline-block;padding:7px 10px;border-radius:999px;background:#13203b;color:#93c5fd;font-size:13px;margin:2px}.hero{margin:22px 0;padding:26px;border:1px solid #263653;border-radius:28px;background:linear-gradient(180deg,#101b35,#0b1225)}.hero h1{margin:0;font-size:34px}.hero p{color:#b6c4dc}.domains{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}.domain{border:1px solid #263653;border-radius:18px;background:#0b1225;padding:14px;cursor:pointer;text-align:center;font-weight:900}.domain.active{border-color:#facc15;background:#2b2208}.main{display:grid;grid-template-columns:1fr 380px;gap:16px}.panel{border:1px solid #263653;border-radius:24px;background:#0b1225;padding:18px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.action{padding:16px;border:0;border-radius:18px;background:#f8fafc;color:#020617;font-weight:900;cursor:pointer}.inputbar{display:flex;gap:8px;margin-top:14px}.inputbar input{flex:1;background:#050816;color:#fff;border:1px solid #263653;border-radius:16px;padding:14px}.inputbar button{border:0;border-radius:16px;padding:14px 16px;background:#facc15;color:#111827;font-weight:900;cursor:pointer}.micBtn{background:#2563eb!important;color:white!important}.flow span{display:inline-block;background:#13203b;color:#bfdbfe;border-radius:999px;padding:7px 10px;font-size:13px;margin:4px}.need,.chatItem{background:#101b35;border:1px solid #263653;border-radius:14px;padding:10px;margin:8px 0;cursor:pointer}.modalBg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;align-items:center;justify-content:center;padding:20px}.modal{width:min(900px,100%);max-height:90vh;overflow:auto;border:1px solid #395072;border-radius:28px;background:#081126}.modalHead{display:flex;justify-content:space-between;padding:20px;border-bottom:1px solid #263653}.modalBody{padding:20px}.close{border:0;border-radius:12px;padding:8px 12px;font-weight:900}.service{background:#101b35;border:1px solid #263653;border-radius:18px;padding:16px;margin:10px 0}.service a{display:block;text-decoration:none;background:#7c3aed;color:white;border-radius:14px;padding:12px;text-align:center;font-weight:900}.deleteBtn{background:#ef4444;color:white;border:0;border-radius:12px;padding:9px 10px;margin-top:8px}.userAdd input{width:100%;background:#050816;color:white;border:1px solid #334155;border-radius:12px;padding:12px;margin:5px 0}.userAdd button{width:100%;border:0;border-radius:14px;background:#facc15;padding:12px;font-weight:900}.bubble{padding:13px 15px;border-radius:18px;margin:10px 0;max-width:88%}.system{background:#243148}.other{background:#123821}.me{background:#1d4ed8;margin-left:auto}.foot{margin-top:16px;color:#64748b;text-align:center;font-size:12px}.foot a{color:#64748b}@media(max-width:900px){.domains{grid-template-columns:repeat(2,1fr)}.main{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}
</style>
</head>

<body>
<div class="app">
  <div class="top">
    <div class="brand" id="productName">말대말</div>
    <div>
      <span class="pill">⚡ 임시 KRXAI</span>
      <span class="pill">🎤 HTTPS 마이크</span>
      <span class="pill">📱 Render 모바일</span>
    </div>
  </div>

  <section class="hero">
    <h1 id="headline"></h1>
    <p id="subtitle"></p>
  </section>

  <section class="domains" id="domains"></section>

  <section class="main">
    <div>
      <section class="panel">
        <h3>대화 시작</h3>
        <div id="currentContext" style="color:#bfdbfe"></div>
        <div class="actions" id="actions"></div>

        <div class="inputbar">
          <input id="inputText"/>
          <button class="micBtn" onclick="startMic()">🎤</button>
          <button onclick="askAi()">AI 응답</button>
        </div>
      </section>

      <section class="panel" style="margin-top:14px">
        <h3>최근 대화 흐름</h3>
        <div id="chatList"></div>
      </section>
    </div>

    <aside class="panel">
      <h3 id="sideTitle">플로우</h3>
      <div class="flow" id="flow"></div>
      <h3>외부 연결</h3>
      <div id="needs"></div>
    </aside>
  </section>

  <div class="foot">
    <a href="/dev">Developer UI</a> ·
    <a href="/krxa">말대말 관제</a> ·
    <a href="/api/ai/memory">AI Memory</a>
  </div>
</div>

<div class="modalBg" id="serviceModal">
  <div class="modal">
    <div class="modalHead">
      <h2 id="modalTitle">서비스 선택</h2>
      <button class="close" onclick="closeModal()">닫기</button>
    </div>
    <div class="modalBody">
      <p id="modalDesc"></p>
      <div id="serviceGrid"></div>
      <div class="userAdd">
        <h3>+ 내가 쓰는 사이트 등록</h3>
        <input id="siteName" placeholder="사이트 이름"/>
        <input id="siteUrl" placeholder="주소"/>
        <input id="siteDesc" placeholder="설명"/>
        <button onclick="addUserSite()">등록</button>
      </div>
    </div>
  </div>
</div>

<div class="modalBg" id="chatModal">
  <div class="modal">
    <div class="modalHead">
      <h2 id="chatTitle">대화창</h2>
      <button class="close" onclick="closeChat()">닫기</button>
    </div>
    <div class="modalBody">
      <div id="chatMessages"></div>
      <div class="inputbar">
        <input id="chatInput" placeholder="대화 입력"/>
        <button class="micBtn" onclick="startChatMic()">🎤</button>
        <button onclick="sendChatMessage()">전송</button>
        <button onclick="chatAi()">AI</button>
        <button onclick="speakLast()">🔊</button>
      </div>
    </div>
  </div>
</div>

<script>
let config,userSites={},domain="travel",activeNeedKey=null,chats=[],activeChat=null;

async function init(){
  const [a,b,c]=await Promise.all([
    fetch('/api/ui/config'),
    fetch('/api/user-sites'),
    fetch('/api/chats')
  ]);
  config=(await a.json()).config;
  userSites=(await b.json()).userSites;
  chats=(await c.json()).chats;

  productName.textContent=config.productName;
  headline.textContent=config.headline;
  subtitle.textContent=config.subtitle;

  domains.innerHTML=config.order.map(code=>
    `<div class="domain" data-domain="${code}" onclick="setDomain('${code}')">${config.domains[code].icon} ${config.domains[code].label}</div>`
  ).join('');

  setDomain(config.order[0]);
  renderChats();
}

function setDomain(next){
  domain=next;
  document.querySelectorAll('.domain').forEach(e=>e.classList.toggle('active',e.dataset.domain===next));
  inputText.value=config.domains[next].sample;
  currentContext.textContent='상황: '+config.domains[next].context;
  renderActions();
  renderSide();
}

function renderActions(){
  const d=config.domains[domain];
  actions.innerHTML=Object.entries(d.actions).map(([code,a])=>
    `<button class="action" onclick="startChat('${code}')">${a.label}</button>`
  ).join('');
}

function renderSide(){
  const d=config.domains[domain];
  sideTitle.textContent=d.label+' 플로우';
  flow.innerHTML=d.flow.map(x=>`<span>${x}</span>`).join('');
  needs.innerHTML=d.needs.map(n=>
    `<div class="need" onclick="openServices('${n.key}')"><b>${n.label}</b><br><span style="color:#94a3b8">${n.desc}</span></div>`
  ).join('');
}

function services(key){
  return [...(config.domains[domain].services?.[key]||[]),...(userSites?.[domain]?.[key]||[])];
}

function openServices(key){
  activeNeedKey=key;
  const n=config.domains[domain].needs.find(x=>x.key===key);
  modalTitle.textContent=config.domains[domain].label+' · '+(n?n.label:'서비스');
  modalDesc.textContent=n?n.desc:'';

  serviceGrid.innerHTML=services(key).map(s=>
    `<div class="service">
      <h3>${s.name}${s.user_added?' <small>내 등록</small>':''}</h3>
      <p>${s.desc}</p>
      <a href="${s.url}" target="_blank">사이트 열기</a>
      ${s.user_added?`<button class="deleteBtn" onclick="deleteUserSite('${s.id}')">삭제</button>`:''}
    </div>`
  ).join('')||'<div class="service">등록된 서비스 없음</div>';

  serviceModal.style.display='flex';
}

function closeModal(){
  serviceModal.style.display='none';
}

async function addUserSite(){
  let name=siteName.value.trim();
  let url=siteUrl.value.trim();
  let desc=siteDesc.value.trim()||'사용자 등록 사이트';

  if(!name||!url)return alert('이름/주소 입력');

  let r=await fetch('/api/user-sites',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({domain,needKey:activeNeedKey,name,url,desc})
  });

  userSites=(await r.json()).userSites;
  siteName.value=siteUrl.value=siteDesc.value='';
  openServices(activeNeedKey);
}

async function deleteUserSite(id){
  let r=await fetch(`/api/user-sites/${domain}/${activeNeedKey}/${id}`,{method:'DELETE'});
  userSites=(await r.json()).userSites;
  openServices(activeNeedKey);
}

async function askAi(){
  let r=await fetch('/api/ai',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({domain,text:inputText.value,mode:'quick'})
  });
  alert('AI 응답: '+(await r.json()).result.output);
}

async function startChat(action){
  let r=await fetch('/api/chat/start',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({domain,action,input:inputText.value})
  });
  activeChat=(await r.json()).chat;
  chats.unshift(activeChat);
  renderChats();
  openChat(activeChat.chat_id);
}

function renderChats(){
  chatList.innerHTML=chats.length?chats.map(c=>
    `<div class="chatItem" onclick="openChat('${c.chat_id}')"><b>${c.title}</b><br><span style="color:#94a3b8">${c.messages.at(-1)?.text||''}</span></div>`
  ).join(''):'<div style="color:#94a3b8">아직 대화 없음</div>';
}

function openChat(id){
  activeChat=chats.find(c=>c.chat_id===id)||activeChat;
  chatTitle.textContent=activeChat.title;
  renderChat();
  chatModal.style.display='flex';
}

function closeChat(){
  chatModal.style.display='none';
}

function renderChat(){
  chatMessages.innerHTML=activeChat.messages.slice(-10).map(m=>
    `<div class="bubble ${m.role==='me'?'me':m.role==='other'?'other':'system'}">${m.text}</div>`
  ).join('');
}

async function sendChatMessage(){
  let text=chatInput.value.trim();
  if(!text)return;
  await addMsg('me',text);
  chatInput.value='';
}

async function chatAi(){
  let text=chatInput.value.trim()||activeChat.messages.at(-1)?.text||'';
  let r=await fetch('/api/ai',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({domain:activeChat.domain,text,mode:'chat'})
  });
  await addMsg('me',(await r.json()).result.output);
  chatInput.value='';
}

async function addMsg(role,text){
  let r=await fetch(`/api/chat/${activeChat.chat_id}/message`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({role,text})
  });
  activeChat=(await r.json()).chat;
  let i=chats.findIndex(c=>c.chat_id===activeChat.chat_id);
  if(i>=0)chats[i]=activeChat;
  renderChat();
  renderChats();
}

function speakLast(){
  let last=[...activeChat.messages].reverse().find(m=>m.role==='me')||activeChat.messages.at(-1);
  if(window.speechSynthesis&&last){
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(last.text));
  }
}

function startMic(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert("이 브라우저는 음성인식을 지원하지 않습니다. Chrome에서 HTTPS로 접속하세요.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "ko-KR";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.start();

  recognition.onresult = function(event){
    const text = event.results[0][0].transcript;
    document.getElementById("inputText").value = text;
  };

  recognition.onerror = function(event){
    alert("마이크 오류: " + event.error);
  };
}

function startChatMic(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert("이 브라우저는 음성인식을 지원하지 않습니다. Chrome에서 HTTPS로 접속하세요.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "ko-KR";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.start();

  recognition.onresult = function(event){
    const text = event.results[0][0].transcript;
    document.getElementById("chatInput").value = text;
  };

  recognition.onerror = function(event){
    alert("마이크 오류: " + event.error);
  };
}

init();
</script>
</body>
</html>
